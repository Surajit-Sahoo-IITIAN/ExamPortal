<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In • Examination Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-canvas: #f8fafc;
            --surface-card: #ffffff;
            --surface-subtle: #f1f5f9;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            --border-focus: #3b82f6;
            --text-title: #0f172a;
            --text-body: #334155;
            --text-sub: #64748b;
            --text-disabled: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-ring: rgba(37, 99, 235, 0.15);
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --danger-border: #fecaca;
            --radius-card: 20px;
            --radius-input: 12px;
            --radius-btn: 12px;
            --shadow-card: 
                0 1px 2px rgba(0, 0, 0, 0.04),
                0 12px 32px -4px rgba(15, 23, 42, 0.08),
                0 0 0 1px rgba(15, 23, 42, 0.04);
            --shadow-btn: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            position: relative;
            background-image: 
                radial-gradient(at 50% 0%, rgba(224, 231, 255, 0.6) 0px, transparent 60%),
                radial-gradient(at 100% 100%, rgba(241, 245, 249, 0.8) 0px, transparent 50%);
            -webkit-font-smoothing: antialiased;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            animation: card-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes card-appear {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Top Brand Logo */
        .auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.3);
        }

        .brand-logo-icon svg {
            width: 26px;
            height: 26px;
            color: #ffffff;
        }

        .auth-brand h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }

        .auth-brand p {
            font-size: 13.5px;
            color: var(--text-sub);
        }

        /* Auth Card */
        .auth-card {
            background: var(--surface-card);
            border-radius: var(--radius-card);
            padding: 32px 30px;
            box-shadow: var(--shadow-card);
        }

        /* Role Segmented Switcher */
        .segmented-control {
            display: flex;
            background: var(--surface-subtle);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            position: relative;
        }

        .segmented-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 12px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--text-sub);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .segmented-btn svg {
            width: 16px;
            height: 16px;
        }

        .segmented-btn.active {
            background: #ffffff;
            color: var(--text-title);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        /* Error Alert */
        .alert-error {
            background: var(--danger-light);
            border: 1px solid var(--danger-border);
            color: #b91c1c;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .alert-error svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Form Fields */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon-left {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-sub);
            pointer-events: none;
            transition: color 0.15s ease;
        }

        .text-input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            background: #ffffff;
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-input);
            font-family: inherit;
            font-size: 14.5px;
            color: var(--text-title);
            outline: none;
            transition: all 0.15s ease;
        }

        .text-input::placeholder {
            color: var(--text-disabled);
        }

        .text-input:hover {
            border-color: var(--border-hover);
        }

        .text-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px var(--primary-ring);
        }

        .text-input:focus + .input-icon-left,
        .text-input:focus ~ .input-icon-left {
            color: var(--primary);
        }

        .btn-eye-toggle {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .btn-eye-toggle:hover {
            color: var(--text-title);
        }

        .btn-eye-toggle svg {
            width: 18px;
            height: 18px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 12.5px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-btn);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: 0.1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-btn);
            transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 24px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit svg {
            width: 16px;
            height: 16px;
        }

        /* Card Footer */
        .card-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--border-light);
            text-align: center;
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .shield-icon {
            width: 14px;
            height: 14px;
            color: #10b981;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 24px 20px;
                border-radius: 16px;
            }
            .auth-brand h1 { font-size: 20px; }
            .text-input { font-size: 14px; padding: 11px 38px 11px 38px; }
        }
    </style>
</head>
<body>

<main class="auth-container">

    <!-- Brand Header -->
    <div class="auth-brand">
        <div class="brand-logo-icon">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
        </div>
        <h1 id="brandTitle">Student Portal</h1>
        <p id="brandSubtitle">Enter your Roll Number & Secret Password to begin</p>
    </div>

    <!-- Login Card -->
    <div class="auth-card">

        <!-- Segmented Role Switcher -->
        <div class="segmented-control" role="tablist">
            <button type="button" class="segmented-btn active" id="tabStudent" onclick="selectRole('student')" role="tab">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
                <span>Student</span>
            </button>
            <button type="button" class="segmented-btn" id="tabTeacher" onclick="selectRole('teacher')" role="tab">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                </svg>
                <span>Teacher</span>
            </button>
        </div>

        {% if form.errors %}
            <div class="alert-error" role="alert">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Invalid credentials. Please verify and try again.</span>
            </div>
        {% endif %}

        <form method="POST" id="authForm">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="id_username" id="usernameLabel">Roll Number</label>
                <div class="input-wrapper">
                    <svg class="input-icon-left" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    <input type="text" name="username" autofocus required id="id_username" class="text-input" placeholder="e.g. ROLL_01" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <div class="input-wrapper">
                    <svg class="input-icon-left" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <input type="password" name="password" required id="id_password" class="text-input" placeholder="Enter private password" autocomplete="current-password">
                    <button type="button" class="btn-eye-toggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnSubmit">
                <span>Sign In to Examination</span>
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>

        <footer class="card-footer">
            <svg class="shield-icon" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
            <span>Anti-Cheat & Encrypted Session Protected</span>
        </footer>

    </div>
</main>

<script>
    function selectRole(role) {
        const tabStudent = document.getElementById('tabStudent');
        const tabTeacher = document.getElementById('tabTeacher');
        const title = document.getElementById('brandTitle');
        const subtitle = document.getElementById('brandSubtitle');
        const label = document.getElementById('usernameLabel');
        const input = document.getElementById('id_username');
        const btnSpan = document.getElementById('btnSubmit').querySelector('span');

        if (role === 'teacher') {
            tabTeacher.classList.add('active');
            tabStudent.classList.remove('active');
            title.innerText = 'Teacher Portal';
            subtitle.innerText = 'Sign in with instructor credentials to manage exams';
            label.innerText = 'Instructor Username';
            input.placeholder = 'e.g. SurajitSahoo';
            btnSpan.innerText = 'Sign In to Dashboard';
        } else {
            tabStudent.classList.add('active');
            tabTeacher.classList.remove('active');
            title.innerText = 'Student Portal';
            subtitle.innerText = 'Enter your Roll Number & Secret Password to begin';
            label.innerText = 'Roll Number';
            input.placeholder = 'e.g. ROLL_01';
            btnSpan.innerText = 'Sign In to Examination';
        }
    }

    function togglePasswordVisibility() {
        const pass = document.getElementById('id_password');
        const icon = document.getElementById('eyeIcon');

        if (pass.type === 'password') {
            pass.type = 'text';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
            `;
        } else {
            pass.type = 'password';
            icon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            `;
        }
    }
</script>

</body>
</html>
