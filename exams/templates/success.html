<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Submitted Successfully</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #090d16;
            --success: #10b981;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 50% 30%, rgba(16, 185, 129, 0.18) 0px, transparent 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f3f4f6;
        }

        .success-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            padding: 42px 36px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .icon-circle {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.3);
        }

        .icon-circle svg {
            width: 36px;
            height: 36px;
        }

        .success-title {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .success-body {
            font-size: 14.5px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: linear-gradient(135deg, #059669, #047857);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>

    <h1 class="success-title">Exam Submitted</h1>
    <p class="success-body">Your answers have been securely recorded and evaluated by the examination system.</p>

    <a href="{% url 'login' %}" class="btn-action">
        Return to Portal
    </a>
</div>

</body>
</html>
